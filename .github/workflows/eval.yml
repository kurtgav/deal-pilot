name: Nightly eval

# Tracks AI quality over time: grounding/hallucination rate (offline) plus
# field-extraction precision/recall (needs a real LLM key, so it runs here on
# a schedule rather than in the per-PR build gate).
on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC nightly
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dealpilot/shared build
      - run: pnpm --filter @dealpilot/api eval
        env:
          # Real key so the extraction precision/recall metric runs instead of
          # being skipped. Set in repo Settings → Secrets → Actions.
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
